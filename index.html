<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>powerflow — playground</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <link rel="stylesheet" href="./src/playground.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>powerflow — playground</h1>
        <p class="sub">
          The same <code>&lt;power-flow&gt;</code> Web Component you'd drop into
          React, Angular, Vue or plain HTML. Drag the sliders or hit "Simulate
          day".
        </p>
      </div>
      <button id="theme-toggle" aria-label="Toggle theme"></button>
    </header>

    <div class="layout">
      <div class="card">
        <div id="action-buttons">
          <button id="get-code">Get code</button>
          <button id="simulate">▶ Simulate day</button>
          <button id="reset-all">Reset</button>
          <button id="shuffle-appliances">Shuffle appliances</button>
          <button id="shuffle-icons">Shuffle icons</button>
          <button id="copy-link">Copy link</button>
        </div>

        <hr />

        <div class="section-title">Appearance</div>
        <div class="ctrl">
          <label>Node style</label>
          <div class="chip-tabs" id="node-style-tabs">
            <button data-node-style="outline">Outline</button>
            <button data-node-style="soft" class="on">Soft</button>
            <button data-node-style="tonal">Tonal</button>
            <button data-node-style="filled">Filled</button>
          </div>
        </div>
        <div class="ctrl">
          <label>Node shape</label>
          <div class="chip-tabs" id="node-shape-tabs">
            <button data-node-shape="circle" class="on">Circle</button>
            <button data-node-shape="square">Square</button>
            <button data-node-shape="hexagon">Hexagon</button>
          </div>
        </div>
        <div class="ctrl">
          <label>Dot shape</label>
          <div class="chip-tabs" id="dot-shape-tabs">
            <button data-dot-shape="circle" class="on">Circle</button>
            <button data-dot-shape="triangle">Triangle</button>
            <button data-dot-shape="chevron">Chevron</button>
            <button data-dot-shape="bolt">Bolt</button>
            <button data-dot-shape="spark">Spark</button>
          </div>
        </div>
        <label class="toggle">
          <input id="icon-style-full" type="checkbox" /> Full-size icons
          (behind labels)
        </label>
        <label class="toggle" id="battery-charge-highlight-ctrl">
          <input id="battery-charge-highlight" type="checkbox" checked />
          Battery charge/discharge highlight
        </label>
        <label class="toggle">
          <input id="track-pulse" type="checkbox" />
          Pulse active tracks (speed follows load)
        </label>
        <div class="ctrl">
          <label>Curve bend <span class="v" id="v-curve-bend"></span></label>
          <!-- Slider position is a plain 0..1 scale, not the curveBend value
               itself — see sliderToCurveBend()/curveBendToSlider() in
               playground-state.ts for the (quadratic, "logarithmic-feeling")
               mapping between the two, which gives finer drag resolution
               near curveBend=0 (the sharp-corner end) than near its
               direct-line max. value="0.6324..." is curveBendToSlider(1),
               the default curveBend. -->
          <input
            id="curve-bend"
            type="range"
            min="0"
            max="1"
            step="0.001"
            value="0.6324555320336759"
          />
        </div>
        <div class="ctrl">
          <label>Dot speed <span class="v" id="v-speed"></span></label>
          <input
            id="speed"
            type="range"
            min="0.1"
            max="3"
            step="0.1"
            value="1"
          />
        </div>
        <div class="ctrl">
          <label>Dots per flow <span class="v" id="v-dot-count"></span></label>
          <input
            id="dot-count"
            type="range"
            min="1"
            max="8"
            step="1"
            value="1"
          />
        </div>
        <div class="ctrl">
          <label>Row gap <span class="v" id="v-row-gap"></span></label>
          <input
            id="row-gap"
            type="range"
            min="110"
            max="180"
            step="1"
            value="125"
          />
        </div>
        <div class="ctrl">
          <label>Column gap <span class="v" id="v-column-gap"></span></label>
          <input
            id="column-gap"
            type="range"
            min="110"
            max="180"
            step="1"
            value="145"
          />
        </div>

        <hr />

        <div class="section-title">Ring colors</div>
        <div class="colors">
          <label>Home <input type="color" id="c-home" value="#818cf8" /></label>
          <label
            >Grid import <input type="color" id="c-grid-in" value="#60a5fa"
          /></label>
          <label
            >Solar <input type="color" id="c-solar" value="#fcd34d"
          /></label>
          <label
            >Grid export <input type="color" id="c-grid-out" value="#f472b6"
          /></label>
          <label
            >Battery charge
            <input type="color" id="c-battery-in" value="#4ade80"
          /></label>
          <label
            >Battery discharge
            <input type="color" id="c-battery-out" value="#fb923c"
          /></label>
          <label
            >Consumer 1 <input type="color" id="c-consumer1" value="#22d3ee"
          /></label>
          <label
            >Consumer 2 <input type="color" id="c-consumer2" value="#2dd4bf"
          /></label>
          <label
            >Consumer 3 <input type="color" id="c-consumer3" value="#38bdf8"
          /></label>
          <label
            >Consumer 4 <input type="color" id="c-consumer4" value="#0d9488"
          /></label>
          <label
            >Battery load 1
            <input type="color" id="c-batteryLoad1" value="#a78bfa"
          /></label>
          <label
            >Battery load 2
            <input type="color" id="c-batteryLoad2" value="#c084fc"
          /></label>
        </div>

        <hr />
        <div class="ctrl">
          <label>Home load <span class="v" id="v-load"></span></label>
          <input
            id="load"
            type="range"
            min="6700"
            max="14700"
            step="50"
            value="8000"
          />
        </div>
        <div class="ctrl">
          <label
            >Grid (− export / + import) <span class="v" id="v-grid"></span
          ></label>
          <input
            id="grid"
            type="range"
            min="-35000"
            max="35000"
            step="50"
            value="4000"
            disabled
          />
        </div>
        <hr />
        <label class="toggle">
          <input id="has-solar" type="checkbox" checked /> Solar
        </label>
        <div class="ctrl" id="solar-ctrls">
          <label>Solar <span class="v" id="v-solar"></span></label>
          <input
            id="solar"
            type="range"
            min="0"
            max="12000"
            step="50"
            value="3000"
          />
        </div>
        <hr />

        <label class="toggle">
          <input id="has-battery" type="checkbox" checked /> Battery
        </label>
        <div class="ctrl" id="battery-ctrls">
          <label
            >Battery (+ charge / − discharge)
            <span class="v" id="v-battery"></span
          ></label>
          <input
            id="battery"
            type="range"
            min="-5000"
            max="5000"
            step="50"
            value="-1000"
          />
          <label style="margin-top: 10px"
            >State of Charge (SOC) <span class="v" id="v-soc"></span
          ></label>
          <input id="soc" type="range" min="0" max="100" step="1" value="69" />
        </div>
        <hr />
        <label class="toggle">
          <input id="has-consumer1" type="checkbox" checked /> Consumer 1
          (above house)
        </label>
        <div class="ctrl" id="consumer1-ctrls">
          <label>Consumer 1 <span class="v" id="v-consumer1"></span></label>
          <input
            id="consumer1"
            type="range"
            min="0"
            max="11000"
            step="100"
            value="6400"
          />
        </div>

        <label class="toggle">
          <input id="has-consumer2" type="checkbox" checked /> Consumer 2
          (below house)
        </label>
        <div class="ctrl" id="consumer2-ctrls">
          <label>Consumer 2 <span class="v" id="v-consumer2"></span></label>
          <input
            id="consumer2"
            type="range"
            min="0"
            max="11000"
            step="100"
            value="300"
          />
        </div>

        <label class="toggle">
          <input id="has-consumer3" type="checkbox" /> Consumer 3 (top-right)
        </label>
        <div class="ctrl" id="consumer3-ctrls">
          <label>Consumer 3 <span class="v" id="v-consumer3"></span></label>
          <input
            id="consumer3"
            type="range"
            min="0"
            max="11000"
            step="100"
            value="1500"
          />
        </div>

        <label class="toggle">
          <input id="has-consumer4" type="checkbox" /> Consumer 4
          (bottom-right)
        </label>
        <div class="ctrl" id="consumer4-ctrls">
          <label>Consumer 4 <span class="v" id="v-consumer4"></span></label>
          <input
            id="consumer4"
            type="range"
            min="0"
            max="11000"
            step="100"
            value="2000"
          />
        </div>

        <hr />

        <label class="toggle">
          <input id="has-batteryLoad1" type="checkbox" /> Battery load 1 (direct
          port)
        </label>
        <div class="ctrl" id="batteryLoad1-ctrls">
          <label>Battery load 1 <span class="v" id="v-batteryLoad1"></span></label>
          <input
            id="batteryLoad1"
            type="range"
            min="0"
            max="3000"
            step="50"
            value="800"
          />
        </div>

        <label class="toggle">
          <input id="has-batteryLoad2" type="checkbox" /> Battery load 2
          (direct port)
        </label>
        <div class="ctrl" id="batteryLoad2-ctrls">
          <label
            >Battery load 2 <span class="v" id="v-batteryLoad2"></span
          ></label>
          <input
            id="batteryLoad2"
            type="range"
            min="0"
            max="3000"
            step="50"
            value="1200"
          />
        </div>

        <hr />

        <div class="section-title">Topology (built-in connections)</div>
        <label class="toggle">
          <input id="topo-solarToHome" type="checkbox" checked /> Solar → home
        </label>
        <label class="toggle">
          <input id="topo-solarToGrid" type="checkbox" checked /> Solar → grid
        </label>
        <label class="toggle">
          <input id="topo-solarToBattery" type="checkbox" checked /> Solar →
          battery
        </label>
        <label class="toggle">
          <input id="topo-batteryToHome" type="checkbox" checked /> Battery →
          home
        </label>
        <label class="toggle">
          <input id="topo-batteryToGrid" type="checkbox" checked /> Battery →
          grid
        </label>

        <hr />

        <div class="section-title">Test cases</div>
        <div id="testcases"></div>
      </div>

      <div class="card diagram-card resize">
        <power-flow id="diagram"></power-flow>
        <span
          id="sim-time"
          style="
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 18px;
            font-weight: 600;
            color: var(--muted);
            pointer-events: none;
            user-select: none;
          "
        ></span>
        <span class="resize-hint">⤡ drag corner to resize</span>
      </div>
    </div>

    <dialog id="code-dialog">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <span style="font-weight: 700; font-size: 15px">Get code</span>
        <button id="close-code" style="padding: 4px 10px">✕</button>
      </div>
      <div class="install-section">
        <div class="chip-tabs" id="pm-tabs"></div>
        <div class="install-cmd-row">
          <code id="install-cmd"></code>
          <button id="copy-install" style="padding:4px 10px; white-space: nowrap; color: #e6edf3; border-color: #e6edf3;">Copy</button>
        </div>
      </div>
      <hr style="margin:0;" />
      <div class="row" id="fw-tabs" style="margin-top: 0"></div>
      <pre id="code-pre"></pre>
      <button id="copy-code" style="width: 100%">Copy code</button>
    </dialog>

    <script type="module" src="./src/playground.ts"></script>
  </body>
</html>
