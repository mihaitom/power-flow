name: Feature request
description: Suggest a new option, node, layout or behavior for the diagram
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! If it's about how the diagram looks or behaves,
        a playground link makes it much easier to discuss — open the
        [live playground](https://mihaitom.github.io/power-flow/), set up
        the closest thing to what you have in mind, click **Copy link**, and
        paste it below. That link encodes your exact `data` + `options`.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description:
        Describe your setup or use case, and what's missing or hard to do today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description:
        How should it look or behave? A sketch, screenshot or example `options`
        snippet is welcome.
    validations:
      required: true

  - type: input
    id: playground-link
    attributes:
      label: Playground link (starting point)
      description: >-
        Optional — the closest setup at https://mihaitom.github.io/power-flow/
        to what you have in mind (click "Copy link").
      placeholder: https://mihaitom.github.io/power-flow/?s=...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds
      description: Anything you've tried or considered instead.
    validations:
      required: false
